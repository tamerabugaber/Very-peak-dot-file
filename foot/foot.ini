[main]
shell=/usr/bin/fish
title=foot
font=JetBrainsMono Nerd Font:size=11:style=Regular
letter-spacing=0
dpi-aware=no
pad=12x12
bold-text-in-bright=no
gamma-correct-blending=no
[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5
blink=yes

[colors-dark]
alpha=0.78
alpha-mode=matching
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

# ~/.config/foot/foot.ini

# Place the include OUTSIDE of any existing [section] blocks


